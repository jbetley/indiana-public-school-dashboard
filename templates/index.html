/** State Management **/
function createStore(initialState) {
  let state = initialState;
  const listeners = new Set();

  return {
    getState: () => state,
    setState: (updater) => {
      // Allow passing either an object or a function receiving previous state
      const nextState = typeof updater === 'function' ? updater(state) : updater;
      state = { ...state, ...nextState };
      listeners.forEach((listener) => listener(state));
    },
    subscribe: (listener) => {
      listeners.add(listener);
      return () => listeners.delete(listener); // Returns an unsubscribe function
    }
  };
}

/* Pages */
async function demographicsPage(data, state) {

   // selectedValues = await getSelectedValues();

   const schoolId = state.school_id;
   const year = state.year;

   let schoolData = data.filter((ele) => ele["School ID"] === schoolId);
   let corpData = data.filter((ele) => ele["School ID"] != schoolId);

   // number of years to limit data - each element in the array
   // represents one year in descending order- so we  remove
   // elements from the front of the array to get array size
   // to yearLimit
   const yearLimit = 5;

   const yearsToRemove = schoolData.length - yearLimit;

   if (yearsToRemove > 0 ) {
      schoolData = dropElements(schoolData, yearsToRemove);
      corpData = dropElements(corpData, yearsToRemove);
   };

   const curYearSchoolDemographics = schoolData.filter(
      (ele) => ele.Year === Number(year)
   )[0];

   const curYearCorpDemographics = corpData.filter(
      (ele) => ele.Year === Number(year)
   )[0];

   // enrollment table data //
   var enrollmentTableObj = Object.entries(curYearSchoolDemographics).reduce(
      (acc, [key, value]) => {
         if (
            (key.startsWith("Grade") && value === 0) ||
            (
               (!key.startsWith("Grade")) && (!key.startsWith("Total"))
            )) {
            return { ...acc };
         }
         return { ...acc, [key]: value };
      }, {}
   );

   // this is the weird as shit way that you rename stuff in js
   delete Object.assign(enrollmentTableObj,
      {["Total"]: enrollmentTableObj["Total Enrollment"]})["Total Enrollment"];

   // remove all elements from the table where the value is 0
   removeItemsByValue(enrollmentTableObj,"0");

   var enrollmentTableData = Object.keys(enrollmentTableObj)
      .map(key => ({grade: key, enrollment: enrollmentTableObj[key]}));

   // numerically sort the list of grades using only the number part
   // of the string (Grade "5")
   enrollmentTableData.sort(
      (a,b) => parseInt(a.grade.slice(6)) - parseInt(b.grade.slice(6))
   );

   // enrollment chart
   let keep = ["Year","Total Enrollment"];

   var enrollmentChartData = filterObj(schoolData, keep);

   // attendance and chronic absenteeism
   keep = ["Year","Attendance Rate", "Chronic Absenteeism %"];
   var attendanceChartData = filterObj(schoolData, keep);

   // remove "%" from "Chronic Absenteeism %""
   attendanceChartData = renameKey(
      attendanceChartData, "Chronic Absenteeism %", "Chronic Absenteeism"
   );

   let attChartkeys = getKeys(attendanceChartData);

   const attChartCols = attChartkeys.filter(e => e !== "Year");
   attendanceChartData["columns"] = attChartCols;

   let attendanceTableData = transposeData(attendanceChartData, "Year");

   // demographic chart data //
   const ethnicityCategories = ethnicity.concat(["School Name", "Total Enrollment"]);
   const statusCategories = subgroup.concat(["School Name", "Total Enrollment"]);

   let ethnicityYearSchool = filterCategories(
      curYearSchoolDemographics, ethnicityCategories
   );
   let ethnicityYearCorp = filterCategories(
      curYearCorpDemographics, ethnicityCategories
   );
   let statusYearSchool = filterCategories(
      curYearSchoolDemographics, statusCategories
   );
   let statusYearCorp = filterCategories(
      curYearCorpDemographics, statusCategories
   );


   let missingEthnicityString = "",
       missingStatusString = "";

   let ethnicityDemoChartData = [],
       statusDemoChartData = [];

   // if school data has two or less keys (name, enrollment) it is considered empty
   if (Object.keys(ethnicityYearSchool).length > 2) {

      // inputs: entity data; array of categories; the value we are finding percentage of,
      // and min percentage to include in final data
      findPercentage(
         ethnicityYearSchool, ethnicity, ethnicityYearSchool["Total Enrollment"], .005
      );
      findPercentage(
         ethnicityYearCorp, ethnicity, ethnicityYearCorp["Total Enrollment"], 0
      );

      // create a string with missing categories if such categories exist
      // and then remove missing data keys
      missingEthnicityString = findMissing(ethnicityYearSchool, ethnicityYearCorp);

      // merge school and corp objects
      let ethnicityArray = [ethnicityYearSchool];
      ethnicityArray.push(ethnicityYearCorp);

      let ethnicityTransposed = transposeData(ethnicityArray, "School Name");
      ethnicityDemoChartData = processBarData(ethnicityTransposed);
   }

   if (Object.keys(statusYearSchool).length > 2) {

      findPercentage(
      statusYearSchool, subgroup, statusYearSchool["Total Enrollment"], .005
      );
      findPercentage(
         statusYearCorp, subgroup, statusYearCorp["Total Enrollment"], 0
      );

      missingStatusString = findMissing(statusYearSchool, statusYearCorp);

      let statusArray = [statusYearSchool];
      statusArray.push(statusYearCorp);

      let statusTransposed = transposeData(statusArray, "School Name");
      statusDemoChartData = processBarData(statusTransposed);
   }

   const attendanceTableGridDiv = document.querySelector("#attendanceTable");
   const enrollmentTableGridDiv = document.querySelector("#enrollmentTable");

   // initialize page
   if (!demographicsPage.initialize) {

      // Enrollment Table
      let enrollmentTableOptions = createEnrollmentTable(enrollmentTableData);
      enrollmentTableGridApi = agGrid.createGrid(
         enrollmentTableGridDiv, enrollmentTableOptions
      );

      // Enrollment Chart
      enrollmentChart = singleLine().data(enrollmentChartData).id("enrollmentChart");
      d3.select("#enrollmentChart").call(enrollmentChart);

      // Chronic Absenteeism and Attendance Rate Table
      let attendanceTableOptions = createBasicTable(attendanceTableData);
      attendanceTableGridApi = agGrid.createGrid(
         attendanceTableGridDiv, attendanceTableOptions
      );

      // Chronic Absenteeism and Attendance Rate Chart
      attendanceChart = multiLine().data(attendanceChartData).id("attendanceChart");
      d3.select("#attendanceChart").call(attendanceChart);

      // Demographics Bar Chart - Ethnicity
      ethnicityDemoChart = horizontalGroupBar().data(
         [ethnicityDemoChartData,missingEthnicityString]
      ).id("ethnicityDemoChart");
      d3.select("#ethnicityDemoChart").call(ethnicityDemoChart);

      // Demographics Bar Chart - Subgroup
      statusDemoChart = horizontalGroupBar().data(
         [statusDemoChartData,missingStatusString]
      ).id("statusDemoChart");
      d3.select("#statusDemoChart").call(statusDemoChart);

      demographicsPage.initialize = true;
   }
   else {   // update page

      let enrollmentTableOptions = createEnrollmentTable(enrollmentTableData);
      
      enrollmentTableGridApi.setGridOption("columnDefs", enrollmentTableOptions.columnDefs);
      enrollmentTableGridApi.setGridOption("rowData", enrollmentTableData);
      
      enrollmentChart.data(enrollmentChartData).id("enrollmentChart");

      let attendanceTableOptions;

      if (attendanceTableData.every((obj) => Object.keys(obj).length === 0)) {
         attendanceTableData = []
         attendanceTableOptions = emptyTableOptions;
         attendanceTableGridDiv.style.setProperty('--ag-borders-critical', 'none');
      } else {
         attendanceTableOptions = createBasicTable(attendanceTableData);
         attendanceTableGridDiv.style.setProperty('--ag-borders-critical', 'solid 1px');
      }

      attendanceTableGridApi.setGridOption("columnDefs", attendanceTableOptions.columnDefs);
      attendanceTableGridApi.setGridOption("rowData", attendanceTableData);

      attendanceChart.data(attendanceChartData).id("attendanceChart");

      ethnicityDemoChart.data(
         [ethnicityDemoChartData,missingEthnicityString]
      ).id("ethnicityDemoChart");

      statusDemoChart.data(
         [statusDemoChartData,missingStatusString]
      ).id("statusDemoChart");
   }
};

         chartIds = [...document.querySelectorAll(
            '[id^="info-ilearn"][id*="chart"]:not([id*="container"])'
         )].map(item => item.id);
      }

   else if (

            el.firstChild.textContent = satLabel;

         tableIds =  [...document.querySelectorAll(

      for (let i = 0; i < stackIds.length; i++) {

   /* Tables */
   //https://www.ag-grid.com/javascript-data-grid/data-update-row-data/

      let infoTableID = "#" + tableIds[k];

         infoTableOptions = createInfoTable(infoTableData, tableIds[k]);

      // need to create a new table if either: 1) infoGridApi[k] is

      if (
         Boolean(infoGridApi[k] && !infoGridApi[k].isDestroyed())

            infoGridApi[k].setGridOption(
               "columnDefs", infoTableOptions.columnDefs

         } else {
            infoGridApi[k].destroy();

         }
      } else {
         infoGridApi[k] = agGrid.createGrid(infoTableGridDiv, infoTableOptions); // create
      }

            analysisTableSubjects = ["Graduation", "Graduation", "Graduation"];
            analysisTableCategories = [gradTotal, ethnicity, subgroup];
         }
         } else {
            analysisTableStartingIndex = 14;
            analysisTableSubjects = ["SAT", "SAT", "SAT"];
            analysisTableCategories = [total, ethnicity, subgroup];
      }

      for (let i=0; i < (analysisTableSubjects.length); i++) {
         let analysisTableNum = analysisTableStartingIndex + i

         analysisTableID = analysisGridApi[analysisTableNum].getGridId()
         analysisTableData = getAnalysisTableData(
            tabledata, analysisTableCategories[i], analysisTableSubjects[i],
            selectedValues, colorState
         );

// TODO: Determine if we even need to create a table if no data exists

         let analysisTableOptions;

         if (!analysisTableData || !analysisTableData.length) {
            analysisTableOptions = {
               columnDefs: [],
               rowData: [],
               suppressNoRowsOverlay: false,
               overlayNoRowsTemplate: '<span style="padding: 10px; border: 2px solid #444; background: lightgoldenrodyellow;">No data to display.</span>',
            };

            // hide table without data
            const tableContainer = analysisTableID.replace(
               "#analysis", "analysis-container"
            );
            const emptyTable = document.getElementById(tableContainer);
            emptyTable.style.display = 'none';
         }
         else {

         let missingCategories = analysisTableData.pop()
         let missingString;

         if (typeof missingCategories !== 'undefined' && missingCategories.length > 0) {
            missingString = "<b>Selected school has no data for:</b> " +
            missingCategories.join(", ") + ".";

            const msgId = analysisTableID.replace("table", "msg").replace("#","");
            let analysisMsgDiv = document.getElementById(msgId);
            analysisMsgDiv.innerHTML = missingString;
         };

            analysisTableOptions = createAnalysisTable(
               analysisTableData, analysisTableID
            );

            // ensure table with data is displayed
            const tableContainer = analysisTableID.replace(
               "#analysis", "analysis-container"
            );
            const emptyTable = document.getElementById(tableContainer);
            emptyTable.style.display = "flex";
         };

      // reset columndefs and rowdata or else table will have empty cols.
      analysisGridApi[analysisTableNum].setGridOption(
         "columnDefs", analysisTableOptions.columnDefs
      );
      analysisGridApi[analysisTableNum].setGridOption("rowData", analysisTableData);
      }
   }

// Waits until an element has a non-empty .value
function waitForElementValue(id) {
  return new Promise((resolve) => {
    // Return immediately if it already exists
    const existingEl = document.getElementById(id);

    if (existingEl.value) return resolve(existingEl);

    const observer = new MutationObserver(() => {
      const el = document.getElementById(id);
      if (el.value) {
        observer.disconnect(); // Stop watching once found
        resolve(el);
      }
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  });
}
